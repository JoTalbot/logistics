name: logistics-collector
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: /etc/logistics/postgres.env
    ports:
      - "127.0.0.1:15439:5432"
    volumes:
      - logistics_pg:/var/lib/postgresql/data
      - /opt/logistics/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U logistics -d logistics]
      interval: 5s
      timeout: 5s
      retries: 20
  collector:
    build:
      context: /opt/logistics
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    init: true
    env_file: /etc/logistics/collector.env
    environment:
      PYTHONUNBUFFERED: '1'
    command: [python, /runtime/collector.py]
    volumes:
      - /opt/logistics/deploy/collector.py:/runtime/collector.py:ro
      - /etc/logistics/telegram.json:/etc/logistics/telegram.json:ro
      - /var/lib/logistics/telegram:/state
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  normalizer:
    image: logistics-collector-collector
    restart: unless-stopped
    init: true
    network_mode: host
    env_file: /etc/logistics/llm.env
    command: [python, /runtime/llm_worker.py]
    environment:
      PYTHONUNBUFFERED: '1'
    volumes:
      - /opt/logistics/deploy/llm_worker.py:/runtime/llm_worker.py:ro
      - /var/lib/logistics/llm-batches:/batches
    mem_limit: 384m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  enqueuer:
    image: logistics-collector-collector
    restart: unless-stopped
    init: true
    network_mode: host
    env_file: /etc/logistics/llm.env
    command: [python, /runtime/llm_enqueue.py]
    environment:
      PYTHONUNBUFFERED: '1'
    volumes:
      - /opt/logistics/deploy/llm_enqueue.py:/runtime/llm_enqueue.py:ro
    mem_limit: 128m
    cpus: 0.2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  logistics_pg:
