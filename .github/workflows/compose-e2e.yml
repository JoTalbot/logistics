name: Compose E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rehearse hardened Compose stack
        env:
          POSTGRES_DB: logistics
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics
          DATABASE_URL: postgresql://logistics:logistics@postgres:5432/logistics
          REVIEW_OPERATOR_TOKEN: ci-only-review-token
          REMOTE_AGENT_TOKEN: ci-only-remote-agent-token
          CONTROL_PLANE_OPERATOR_TOKEN: ci-only-control-plane-token
          API_PORT: 18000
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color api recurring-demand-scheduler postgres || true
            docker compose down -v --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose up -d --build postgres api recurring-demand-scheduler
          docker compose ps

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/ready >/tmp/logistics-ready.json; then
              cat /tmp/logistics-ready.json
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Compose API readiness check timed out" >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:18000/health
          echo
          docker compose exec -T recurring-demand-scheduler python -c 'import psycopg, os; conn=psycopg.connect(os.environ["DATABASE_URL"]); assert conn.execute("SELECT 1").fetchone() == (1,); assert conn.execute("SELECT 1 FROM information_schema.columns WHERE table_name = %s AND column_name = %s", ("remote_agents", "credential_revoked_at")).fetchone() == (1,); assert conn.execute("SELECT 1 FROM information_schema.columns WHERE table_name = %s AND column_name = %s", ("remote_agents", "credential_generation")).fetchone() == (1,); assert conn.execute("SELECT 1 FROM information_schema.columns WHERE table_name = %s AND column_name = %s", ("remote_tasks", "lease_credential_generation")).fetchone() == (1,); assert conn.execute("SELECT 1 FROM pg_indexes WHERE indexname = %s", ("remote_tasks_agent_idempotency_idx",)).fetchone() == (1,); print("remote-control migrations 0027-0029: PASS"); conn.close()'
          docker compose ps
          echo "hardened Compose end-to-end rehearsal: PASS"
