name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: logistics
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistics -d logistics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test,observability]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit
      - name: Apply SQL migrations
        env:
          PGPASSWORD: logistics
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U logistics -d logistics -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Run unit and integration tests
        env:
          DATABASE_URL: postgresql://logistics:logistics@127.0.0.1:5432/logistics
          LARDI_API_KEY: ${{ secrets.LARDI_API_KEY }}
          REVIEW_OPERATOR_TOKEN: ci-only-review-token
          REMOTE_AGENT_TOKEN: ci-only-remote-agent-token
          CONTROL_PLANE_OPERATOR_TOKEN: ci-only-control-plane-token
        run: pytest
      - name: Run V20 commercial baseline replay
        run: python scripts/v20_baseline.py
      - name: Validate hardened Compose contract
        env:
          POSTGRES_DB: logistics
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics
          DATABASE_URL: postgresql://logistics:logistics@postgres:5432/logistics
          REVIEW_OPERATOR_TOKEN: ci-only-review-token
          REMOTE_AGENT_TOKEN: ci-only-remote-agent-token
          CONTROL_PLANE_OPERATOR_TOKEN: ci-only-control-plane-token
          API_PORT: "8000"
        run: docker compose config --quiet
      - name: Run local release smoke checks
        run: python scripts/release_smoke.py
      - name: Build hardened API image
        run: docker build -f docker/api.Dockerfile -t logistics-api:ci .
