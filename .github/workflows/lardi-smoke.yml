name: Lardi read-only smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Read-only Lardi API smoke
        env:
          LARDI_API_KEY: ${{ secrets.LARDI_API_KEY }}
          LARDI_TRANS_API_TOKEN: ""
        run: python scripts/lardi_smoke.py
