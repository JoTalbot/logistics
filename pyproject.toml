[project]
name = "logistics-os"
version = "0.1.0"
description = "AI Logistics OS V1 domain and event skeleton"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "telethon>=1.43,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"
