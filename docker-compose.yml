services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:logistics@postgres:5432/logistics
      REVIEW_OPERATOR_TOKEN: ${REVIEW_OPERATOR_TOKEN:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  recurring-demand-scheduler:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:logistics@postgres:5432/logistics
    command: ["python", "-m", "logistics.recurring_demand_scheduler"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_initial.sql:/docker-entrypoint-initdb.d/0001_initial.sql:ro
      - ./migrations/0002_telegram_ingestion.sql:/docker-entrypoint-initdb.d/0002_telegram_ingestion.sql:ro
      - ./migrations/0003_telegram_canonical_loads.sql:/docker-entrypoint-initdb.d/0003_telegram_canonical_loads.sql:ro
      - ./migrations/0004_local_llm.sql:/docker-entrypoint-initdb.d/0004a_local_llm.sql:ro
      - ./migrations/0004_outbox_delivery.sql:/docker-entrypoint-initdb.d/0004b_outbox_delivery.sql:ro
      - ./migrations/0005_llm_batches.sql:/docker-entrypoint-initdb.d/0005_llm_batches.sql:ro
      - ./migrations/0006_enqueue_heartbeat.sql:/docker-entrypoint-initdb.d/0006_enqueue_heartbeat.sql:ro
      - ./migrations/0007_outbox_delivery.sql:/docker-entrypoint-initdb.d/0007_outbox_delivery.sql:ro
      - ./migrations/0008_market_ops.sql:/docker-entrypoint-initdb.d/0008_market_ops.sql:ro
      - ./migrations/0009_demand_graph.sql:/docker-entrypoint-initdb.d/0009a_demand_graph.sql:ro
      - ./migrations/0009_demand_negotiation.sql:/docker-entrypoint-initdb.d/0009b_demand_negotiation.sql:ro
      - ./migrations/0010_market_intelligence.sql:/docker-entrypoint-initdb.d/0010_market_intelligence.sql:ro
      - ./migrations/0011_opportunity_recommendations.sql:/docker-entrypoint-initdb.d/0011_opportunity_recommendations.sql:ro
      - ./migrations/0012_customer_discovery.sql:/docker-entrypoint-initdb.d/0012_customer_discovery.sql:ro
      - ./migrations/0013_customer_opportunity.sql:/docker-entrypoint-initdb.d/0013_customer_opportunity.sql:ro
      - ./migrations/0014_prospect_hardening.sql:/docker-entrypoint-initdb.d/0014_prospect_hardening.sql:ro
      - ./migrations/0015_recurring_demand.sql:/docker-entrypoint-initdb.d/0015_recurring_demand.sql:ro
      - ./migrations/0016_contact_intents.sql:/docker-entrypoint-initdb.d/0016_contact_intents.sql:ro
      - ./migrations/0017_contact_intent_audit.sql:/docker-entrypoint-initdb.d/0017_contact_intent_audit.sql:ro
      - ./migrations/0018_duplicate_load_indexing.sql:/docker-entrypoint-initdb.d/0018_duplicate_load_indexing.sql:ro
      - ./migrations/0019_recurring_demand_runs.sql:/docker-entrypoint-initdb.d/0019_recurring_demand_runs.sql:ro
      - ./migrations/0020_commercial_priority.sql:/docker-entrypoint-initdb.d/0020_commercial_priority.sql:ro
      - ./migrations/0021_outbox_delivery_telemetry.sql:/docker-entrypoint-initdb.d/0021_outbox_delivery_telemetry.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
